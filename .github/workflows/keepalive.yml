# 2026-10-30 21:58 KST
# 매일 1번 DB에 질의를 보내 Supabase 프로젝트가 일시정지되지 않게 함
# DATABASE_URL은 저장소의 Settings > Secrets and variables > Actions에 등록해야 함(값은 이 파일에 쓰지 않음)
name: keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.3.6"
      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
